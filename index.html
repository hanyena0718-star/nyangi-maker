<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>냥이 메이커</title>
<meta name="description" content="공부하면 고양이가 자라는 공부 앱">
<meta name="theme-color" content="#E2678A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="냥이 메이커">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: 한 손 세로 화면. 위 머리줄(골드·슬롯), 탭별 화면, 하단 고정 탭바 5개 */
:root{
  --bg:#EDEBF5; --panel:#FFFFFF; --ink:#2A2747; --muted:#6E6A8C; --line:#D9D5EA; --soft:#F5F3FB;
  --accent:#E2678A; --accent-ink:#FFFFFF; --sky:#C9D6F4; --floor:#E9D9C4; --gold:#D99A22; --danger:#C9483A; --good:#3FA47A;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17162A; --panel:#22213A; --ink:#ECEAF8; --muted:#A5A1C4; --line:#38365A; --soft:#2A2944;
  --accent:#F082A2; --accent-ink:#1B1A2E; --sky:#2C3460; --floor:#4A3E36; --gold:#F1BC5A; --danger:#F07A6A; --good:#5CC496; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17162A; --panel:#22213A; --ink:#ECEAF8; --muted:#A5A1C4; --line:#38365A; --soft:#2A2944;
  --accent:#F082A2; --accent-ink:#1B1A2E; --sky:#2C3460; --floor:#4A3E36; --gold:#F1BC5A; --danger:#F07A6A; --good:#5CC496; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-size:23px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.coin{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:19px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}
.btn{font-family:var(--display);font-size:15px;border:0;border-radius:12px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{font-size:13px;padding:5px 10px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px 11px;min-width:0}
.form{display:flex;gap:8px;flex-wrap:wrap}
.form input[type=text]{flex:1 1 180px}
/* 방 */
.room{border-radius:22px;overflow:hidden;border:2px solid var(--line);background:var(--sky);position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.room:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hearts{position:absolute;inset:0;pointer-events:none}
.hearts i{position:absolute;font-style:normal;font-size:22px;color:#E2678A;animation:up 1.3s ease-out forwards}
@keyframes up{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-70px) scale(1.1);opacity:0}}
.say{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);color:var(--ink);border-radius:14px;padding:6px 12px;font-size:13px;max-width:80%;text-align:center;box-shadow:0 2px 0 var(--line)}
.room svg{display:block;width:100%;height:auto}
.namebar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.namebar h2{font-size:23px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.hot{border-color:var(--accent);color:var(--accent)}
.prog{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
/* 게이지 */
.gauges{display:grid;gap:10px}
.gauge{display:grid;grid-template-columns:52px auto 1fr auto;align-items:center;gap:10px}
.pips{display:flex;gap:5px}
.pip{width:22px;height:12px;border-radius:6px;background:var(--line)}
.pip.on{background:var(--good)}
.pip.on.low{background:var(--danger)}
.gstate{font-size:12px;color:var(--danger);min-width:0}
.gstate.next{color:var(--muted)}
@media (max-width:420px){.gauge{grid-template-columns:48px auto 1fr;}.gauge .btn{grid-column:1/-1;justify-self:stretch}}
.alert{border:2px solid var(--danger);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* 스탯 */
.stats{display:grid;gap:7px}
.stat{display:grid;grid-template-columns:52px 1fr 36px;align-items:center;gap:8px;font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
.stat .v{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--display);font-size:15px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:baseline}
.log .ld{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .lt{font-size:14px;min-width:0;overflow-wrap:anywhere}
/* 과제 */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datenav h3{font-size:20px;text-align:center;flex:1}
.nav{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:2px solid var(--line);font-family:var(--display)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task .t small{display:block;color:var(--muted);font-size:12px}
.task.done .t>span{text-decoration:line-through;color:var(--muted)}
.chk{all:unset;cursor:pointer;width:26px;height:26px;border-radius:8px;border:2px solid var(--accent);display:grid;place-items:center;flex:none;color:var(--accent-ink);font-size:15px}
.done .chk{background:var(--accent)}
.chk[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.x{all:unset;cursor:pointer;color:var(--muted);font-size:19px;padding:0 4px}
.daypick{display:flex;gap:5px;flex-wrap:wrap}
.toggle{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.toggle[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;font-family:var(--display);font-size:17px}
/* 뽀모도로 */
.pomo{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.pomo .clock{font-family:var(--display);font-size:40px;font-variant-numeric:tabular-nums;line-height:1}
.pomo svg{width:96px;height:auto}
/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--muted)}
.cal button{all:unset;cursor:pointer;border-radius:10px;padding:6px 0 4px;font-size:13px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:38px}
.cal button.today{outline:2px solid var(--accent)}
.cal button i{width:6px;height:6px;border-radius:50%;background:transparent}
.cal button i.l1{background:var(--accent);opacity:.45}
.cal button i.l2{background:var(--accent);opacity:.75}
.cal button i.l3{background:var(--accent)}
.goal{display:flex;align-items:center;gap:10px}
.goal .t{flex:1;min-width:0;overflow-wrap:anywhere}
.goal.done .t{text-decoration:line-through;color:var(--muted)}
.week{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.week b{font-family:var(--display);font-weight:400;font-size:16px}
/* 앨범 */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.acard{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:13px}
.acard svg{width:90px;height:auto}
.acard b{font-family:var(--display);font-weight:400;font-size:16px}
/* 통계 */
.num{font-family:var(--display);font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px}
.col{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%}
.cv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:16px}
.cb{flex:1;width:60%;max-width:28px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.cb i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;transition:height .4s}
.cl{font-size:12px;color:var(--muted)}
.col.today .cl{color:var(--accent);font-weight:700}
.sbars{display:grid;gap:8px}
.sbar{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;font-size:13px}
.sbar .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .sv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 상점 */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.item{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.item b{font-family:var(--display);font-weight:400;font-size:16px}
.item span{font-size:12px;color:var(--muted)}
.item.on{border-color:var(--accent)}
/* 도감·슬롯 */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.dexc{border-radius:12px;padding:9px 10px;background:var(--soft);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:58px}
.dexc b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink)}
.dexc.no b{color:var(--muted)}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);flex-wrap:wrap}
.slot.cur{outline:2px solid var(--accent)}
.slot .t{flex:1;min-width:140px}
.slot .t small{display:block;color:var(--muted);font-size:12px}
textarea{font:inherit;font-size:12px;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px;width:100%;min-height:70px;box-sizing:border-box;resize:vertical}
/* 탭바·토스트·모달 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:3}
.tabbar nav{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{all:unset;cursor:pointer;text-align:center;padding:12px 0;font-family:var(--display);font-size:16px;color:var(--muted);position:relative}
.tab[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:5px;margin-left:1px;background:var(--accent);color:var(--accent-ink);font-size:11px;border-radius:999px;padding:0 6px;font-family:var(--body)}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s;pointer-events:none;z-index:6}
.modal{position:fixed;inset:0;background:rgba(20,18,40,.55);display:grid;place-items:center;padding:20px;z-index:5}
.card{background:var(--panel);border-radius:22px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;max-height:90vh;overflow:auto;box-sizing:border-box}
.card h2{font-size:25px}
.card .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card .cat{width:170px;max-width:60%}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.hop{animation:hop .7s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>냥이 메이커</h1>
    <div class="chips">
      <span class="pill" id="now" aria-live="off"></span><span class="tag" id="slotTag">슬롯 1</span>
      <span class="pill"><span class="coin"></span><span id="gold">0</span>G</span>
    </div>
  </header>
  <main id="main" class="view"></main>
</div>

<div class="tabbar"><nav role="tablist">
  <button class="tab" role="tab" data-tab="cat">고양이</button>
  <button class="tab" role="tab" data-tab="today">오늘<span class="badge" id="todayBadge" hidden></span></button>
  <button class="tab" role="tab" data-tab="goals">목표</button>
  <button class="tab" role="tab" data-tab="shop">상점</button>
  <button class="tab" role="tab" data-tab="more">더보기</button>
</nav></div>
<div class="toast" id="toast" style="opacity:0"></div>
<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
/* ===== 상수 ===== */
const DAY=864e5, KEY='nyangi-maker-v2', GOLD_PER_TASK=10, CARE_PRICE=10, END_AT=150;
const STATS=[['int','지성','#5B7BE0'],['str','무력','#D4573B'],['hp','체력','#3FA47A'],['cha','매력','#E2678A'],['emo','감성','#9467C9'],['dex','손재주','#C9862E'],['ele','기품','#4A9DB0']];
const SN=Object.fromEntries(STATS.map(s=>[s[0],s[1]]));
const STAGES=[{n:'아기',min:0,s:.6},{n:'어린이',min:30,s:.78},{n:'청년',min:90,s:.94}];
const GAUGES=[['food','배고픔','밥 주기','흑화'],['fun','재미','놀아주기','삐짐'],['clean','청결','씻기기','대머리']];
const FLAG={food:'dark',fun:'sulk',clean:'bald'};
const RECOVER={dark:{n:'따뜻한 특식',p:30,g:'food',msg:'따뜻한 밥… 마음이 다시 말랑해졌다냥.'},sulk:{n:'화해 선물 상자',p:30,g:'fun',msg:'선물로 넘어가는 거 아니다냥. …근데 받을게.'},bald:{n:'고급 발모제',p:60,g:'clean',msg:'털이 다시 났다! 다시 태어난 기분이다냥.'}};
const VOICE={dark:'배고프다… 세상이 다 미워진다. 흐흐흐.',sulk:'나랑 안 놀아주지? 흥. 이제 안 봐줄 거다냥.',bald:'털이… 내 털이… 거울 보기 싫다냥.',
  food:['밥 맛있다냥. 집사 오늘 좀 괜찮네.','냠냠. 한 그릇 더는 안 되냥?','배부르니까 세상이 아름답다냥.'],
  fun:['낚싯대 잡았다! 내가 이겼다냥.','더 놀자냥. 아직 하나도 안 지쳤다냥.','우다다다! 오늘 컨디션 최고다냥.'],
  clean:['물은 싫지만… 보송보송한 건 좋다냥.','목욕은 배신이다. 그래도 향기는 마음에 든다냥.','반짝반짝. 오늘 나 좀 예쁜 듯냥.'],
  task:t=>pick([`집사가 ‘${t}’ 끝냈다. 츄르값 벌어왔다냥.`,`‘${t}’… 뭔지 모르지만 집사 멋있었다냥.`,`집사가 공부하는 동안 옆에서 지켜봤다. 감독도 일이다냥.`])};
const COATS={
  cheese:{n:'치즈',body:'#F2B36A',stripe:'#D98A3D',chest:'#FBE6C8'},
  mack:{n:'고등어',body:'#A9AEBB',stripe:'#5F6576',chest:'#ECECF1'},
  tux:{n:'턱시도',body:'#34333D',chest:'#FFFFFF',dk:1},
  calico:{n:'삼색',body:'#FBF8F2',chest:'#FFFFFF',calico:1},
  white:{n:'흰냥',body:'#F7F4EE',chest:'#FFFFFF'},
  black:{n:'검은냥',body:'#2B2A33',chest:'#2B2A33',dk:1}
};
const WEAR=[
  {id:'ribbon',slot:'head',n:'빨간 리본',p:20,st:0},{id:'chick',slot:'head',n:'병아리 모자',p:25,st:0},{id:'flower',slot:'head',n:'꽃 머리핀',p:20,st:0},
  {id:'pacifier',slot:'face',n:'쪽쪽이',p:15,st:0},{id:'glasses',slot:'face',n:'동그란 안경',p:40,st:0},
  {id:'bib',slot:'neck',n:'아기 턱받이',p:15,st:0},{id:'bell',slot:'neck',n:'방울 목걸이',p:30,st:0},
  {id:'raincoat',slot:'body',n:'노란 우비',p:35,st:0},{id:'rattle',slot:'hand',n:'딸랑이',p:15,st:0},
  {id:'kinder',slot:'head',n:'유치원 모자',p:30,st:1},{id:'star',slot:'head',n:'별 머리띠',p:35,st:1},{id:'cap',slot:'head',n:'학사모',p:80,st:1},{id:'crown',slot:'head',n:'왕관',p:150,st:1},
  {id:'heartsg',slot:'face',n:'하트 선글라스',p:40,st:1},{id:'scarf',slot:'neck',n:'줄무늬 목도리',p:50,st:1},

const stageIdx=done=>done>=90?2:done>=30?1:0;

function decay(){
  const c=C();if(!c)return;const now=Date.now();
  for(const [k] of GAUGES){
    const g=c.g[k];const steps=Math.floor((now-g.t)/DAY);
    if(steps>0){g.lv=Math.max(1,g.lv-steps);g.t+=steps*DAY;}
    const f=FLAG[k];
    if(g.lv<=1&&!c.flag[f]){c.flag[f]=true;c.cnt[f]++;addLog(VOICE[f]);}
  }
}
function addLog(m){const c=C();c.log.unshift({d:todayS(),t:m});c.log=c.log.slice(0,15)}
function statGain(subId){
  const c=C(),s=S();if(c.flag.sulk)return null;
  const sub=s.subjects.find(x=>x.id===subId);
  const amt=1+Math.floor(Math.random()*3);let k;
  if(sub&&sub.stats.length&&Math.random()<.7)k=pick(sub.stats);
  else{const pool=STATS.map(x=>x[0]).filter(x=>!(sub&&sub.stats.includes(x)));k=pick(pool.length?pool:STATS.map(x=>x[0]));}
  c.stats[k]+=amt;return{k,amt};
}
function reward(subId,what){
  const s=S(),c=C();const before=stageIdx(c.done);
  s.gold+=GOLD_PER_TASK;c.done++;
  const g=statGain(subId);
  let m=`+${GOLD_PER_TASK}G`;
  m+=g?` · ${SN[g.k]} +${g.amt}`:' · 삐져서 스탯이 오르지 않았어요';
  toast(`${what} 완료! ${m}`);
  const after=stageIdx(c.done);
  if(after>before){if(after===2)c.youthAt=Date.now();addLog(after===1?'몸이 쑥 컸다! 이제 아기 아니다냥.':'어른 고양이가 됐다. 2주 안에 내 꿈을 정해야 한다냥.');setTimeout(()=>growModal(after),400);}
}
function decideJob(c){
  const v=STATS.map(s=>c.stats[s[0]]);
  if(c.cnt.dark>=3)return{id:'mafia',g:0};
  if(c.cnt.bald>=3)return{id:'monk',g:0};
  if(Math.min(...v)>=KING_AT)return{id:'king',g:0};
  if(Math.max(...v)<NAP_BELOW)return{id:'nap',g:0};
  const order=STATS.map(s=>s[0]).sort((a,b)=>c.stats[b]-c.stats[a]);
  const top=[order[0],order[1]].sort((a,b)=>STATS.findIndex(s=>s[0]===a)-STATS.findIndex(s=>s[0]===b));
  const second=c.stats[order[1]];
  return{id:top.join('-'),g:second>=GOOD_AT?3:second>=NORMAL_AT?2:1};
}

    case 'mclose':closeModal();pending=null;break;

    case 'care':{const k=b.dataset.k;if(s.gold<CARE_PRICE)return;s.gold-=CARE_PRICE;c.g[k].lv=Math.min(3,c.g[k].lv+1);c.g[k].t=Date.now();
      addLog(pick(VOICE[k]));toast(`${GAUGES.find(x=>x[0]===k)[1]} +1`);render();break}
    case 'recover':{const f=b.dataset.f,r=RECOVER[f];if(s.gold<r.p)return;s.gold-=r.p;c.flag[f]=false;c.g[r.g].lv=3;c.g[r.g].t=Date.now();addLog(r.msg);toast(r.msg);render();break}
    case 'day':{const n=+b.dataset.n;selDate=n===0?todayS():addDays(selDate,n);render();break}
    case 'pickday':selDate=b.dataset.d;tab='today';render();window.scrollTo(0,0);break;
    case 'done':{if(b.getAttribute('aria-disabled')==='true'){if(!canCheck(selDate))toast('과제는 오늘과 어제 것만 체크할 수 있어요.');return}
      const t=s.tasks.find(x=>x.id===b.dataset.id);if(!t)return;t.doneOn[selDate]=true;addLog(VOICE.task(t.text));reward(t.sub,'과제');render();break}
    case 'edittask':editModal(b.dataset.id);break;
    case 'erep':{eRep=b.dataset.v;document.querySelectorAll('[data-a=erep]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===eRep));$('eDays').hidden=eRep!=='days';$('eDateRow').hidden=eRep!=='once';break}
    case 'ewd':{const d=+b.dataset.d;eDays=eDays.includes(d)?eDays.filter(x=>x!==d):[...eDays,d];b.setAttribute('aria-pressed',eDays.includes(d));break}
    case 'savetask':{const t=s.tasks.find(x=>x.id===b.dataset.id);if(!t)return;const text=$('eText').value.trim();if(!text){toast('과제 내용을 적어주세요.');return}
      if(eRep==='days'&&!eDays.length){toast('요일을 하나 이상 골라주세요.');return}
      t.text=text;t.sub=$('eSub').value;t.rep=eRep;if(eRep==='once'){t.date=$('eDate').value||t.date||selDate;delete t.days}else{delete t.date;if(eRep==='days')t.days=[...eDays];else delete t.days}
      closeModal();render();toast('과제를 고쳤어요.');break}
    case 'pet':pet();break;
    case 'backupnow':closeModal();D.snooze=Date.now();exportFile();break;
    case 'backuplater':D.snooze=Date.now();save();closeModal();break;
    case 'week':statWeek+=+b.dataset.n;render();break;
    case 'deltask':{const t=s.tasks.find(x=>x.id===b.dataset.id);if(!t)return;
      confirmBox('과제를 지울까요?',`"${esc(t.text)}"${t.rep==='once'?'':' (반복 과제라 모든 날짜에서 사라져요)'}`,'지우기',()=>{s.tasks=s.tasks.filter(x=>x!==t);render()});break}
    case 'rep':newRep=b.dataset.v;keepInput(()=>render());break;
    case 'wd':{const d=+b.dataset.d;newDays=newDays.includes(d)?newDays.filter(x=>x!==d):[...newDays,d];keepInput(()=>render());break}
    case 'addtask':{const text=$('tText').value.trim();if(!text){toast('과제 내용을 적어주세요.');return}
      if(newRep==='days'&&!newDays.length){toast('요일을 하나 이상 골라주세요.');return}
      const t={id:uid(),text,sub:$('tSub').value,rep:newRep,from:newRep==='once'?selDate:(selDate>todayS()?selDate:todayS()),doneOn:{}};
      if(newRep==='once')t.date=selDate;if(newRep==='days')t.days=[...newDays];s.tasks.push(t);render();toast('과제를 추가했어요.');break}
    case 'substat':{const k=b.dataset.k;newSubStats=newSubStats.includes(k)?newSubStats.filter(x=>x!==k):(newSubStats.length>=2?[newSubStats[1],k]:[...newSubStats,k]);keepInput(()=>render(),true);break}
    case 'addsub':{const n=$('sName').value.trim();if(!n){toast('과목 이름을 적어주세요.');return}if(!newSubStats.length){toast('스탯을 하나 이상 골라주세요.');return}
      s.subjects.push({id:uid(),name:n,stats:[...newSubStats]});render();toast(`${n} 과목을 만들었어요.`);break}
    case 'delsub':{const x=s.subjects.find(y=>y.id===b.dataset.id);confirmBox('과목을 지울까요?',`${esc(x.name)} 과목을 지워도 과제는 남고, "과목 없음"이 돼요.`,'지우기',()=>{s.subjects=s.subjects.filter(y=>y!==x);s.tasks.forEach(t=>{if(t.sub===x.id)t.sub=''});render()});break}
    case 'pstart':{const f=Math.min(120,Math.max(15,parseInt($('pF').value)||25)),r=Math.min(60,Math.max(1,parseInt($('pR').value)||5));
      s.pomo.focus=f;s.pomo.rest=r;s.pomo.sub=$('pSub').value;s.pomo.run={phase:'focus',start:Date.now(),dur:f*60000,sub:s.pomo.sub};render();toast(`${f}분 집중 시작!`);break}
    case 'pstop':confirmBox('그만둘까요?',s.pomo.run.phase==='focus'?'끝까지 마치지 않으면 보상을 받을 수 없어요.':'휴식을 끝내요.','그만두기',()=>{s.pomo.run=null;render()});break;
    case 'month':{const[y,m]=calMonth.split('-').map(Number);calMonth=mKey(new Date(y,m-1+(+b.dataset.n),1));render();break}
    case 'addgoal':{const l=b.dataset.l,w=b.dataset.w,inp=$(l==='m'?'mg':'wg'+w),text=inp.value.trim();if(!text)return;const gm=s.goals[calMonth];
      const g={id:uid(),text,done:false};if(l==='m')gm.items.push(g);else(gm.weeks[w]=gm.weeks[w]||[]).push(g);render();break}
    case 'goal':{const gm=s.goals[calMonth],l=b.dataset.l,list=l==='m'?gm.items:gm.weeks[b.dataset.w],g=list.find(x=>x.id===b.dataset.id);g.done=!g.done;
      if(g.done){addLog(l==='m'?`집사가 ‘${g.text}’ 해냈다! 오늘은 꾹꾹이 해줘야지.`:`집사가 ‘${g.text}’ 해냈다. 나도 좀 자랑스럽다냥.`);render();celebrate(l,g.text)}else render();break}
    case 'delgoal':{const gm=s.goals[calMonth],l=b.dataset.l;if(l==='m')gm.items=gm.items.filter(x=>x.id!==b.dataset.id);else gm.weeks[b.dataset.w]=gm.weeks[b.dataset.w].filter(x=>x.id!==b.dataset.id);render();break}
    case 'buywear':{const w=WEAR.find(x=>x.id===b.dataset.id);if(s.gold<w.p)return;s.gold-=w.p;s.owned.push(w.id);s.wear[w.slot]=w.id;if(w.set)Object.assign(s.wear,w.set);toast(`${w.n}을(를) 샀어요.`);render();break}
    case 'wear':{const w=WEAR.find(x=>x.id===b.dataset.id);if(s.wear[w.slot]===w.id){delete s.wear[w.slot];if(w.set)for(const k in w.set)if(s.wear[k]===w.set[k])delete s.wear[k]}else{s.wear[w.slot]=w.id;if(w.set)Object.assign(s.wear,w.set)}render();break}
    case 'buyfurn':{const f=FURN.find(x=>x.id===b.dataset.id);if(s.gold<f.p)return;s.gold-=f.p;s.furn.push(f.id);toast(`${f.n}을(를) 방에 놓았어요.`);render();break}
    case 'furnoff':s.furn=s.furn.filter(x=>x!==b.dataset.id);s.furnOff.push(b.dataset.id);render();break;
    case 'furnon':s.furnOff=s.furnOff.filter(x=>x!==b.dataset.id);s.furn.push(b.dataset.id);render();break;
    case 'buydeco':{const k=b.dataset.k,d=(k==='wall'?WALLS:FLOORS).find(x=>x.id===b.dataset.id);if(s.gold<d.p)return;s.gold-=d.p;s.deco.push(k+':'+d.id);s[k]=d.id;addLog(k==='wall'?'벽이 새로 바뀌었다. 냄새부터 맡아봐야겠다냥.':'바닥이 바뀌었다! 뒹굴뒹굴 테스트 해본다냥.');toast(`${d.n}(으)로 바꿨어요.`);render();break}
    case 'setdeco':s[b.dataset.k]=b.dataset.id;render();break;
    case 'buypet':{const pt=PETS.find(x=>x.id===b.dataset.id);if(s.gold<pt.p)return;s.gold-=pt.p;s.pets.push(pt.id);s.pet=pt.id;addLog(pt.line);toast(`${pt.n}이(가) 왔어요!`);render();break}
    case 'peton':s.pet=b.dataset.id;render();break;
    case 'petoff':s.pet=null;render();break;
    case 'train':{const k=b.dataset.k,p=trainPrice(k);if(s.gold<p)return;const g=trainGain(k);s.gold-=p;c.stats[k]+=g;c.train[k]=(c.train[k]||0)+1;addLog(`${TRAIN[k][0]} 다녀왔다. ${SN[k]} +${g}. 힘들었지만 뿌듯하다냥.`);toast(`${SN[k]} +${g}`);render();break}
    case 'tool':{const k=b.dataset.k;if(s.gold<TOOL_PRICE)return;s.gold-=TOOL_PRICE;c.tools.push(k);toast(`${TRAIN[k][1]}을(를) 샀어요.`);render();break}
    case 'newcat':{const n=($('newName').value||'').trim()||'모찌';s.cat=newCat(n);closeModal();tab='cat';render();toast(`${n}이(가) 집에 왔어요! 무늬는 ${COATS[s.cat.coat].n}.`);break}
    case 'slotgo':D.active=+b.dataset.i;tab='cat';render();break;
    case 'slotnew':startModal(+b.dataset.i);break;
    case 'createslot':{const i=+b.dataset.i,n=($('newName').value||'').trim()||'모찌';if(!D)D={v:2,active:i,slots:[null,null,null,null,null],dex:[],dexG:{},album:[],since:Date.now()};D.slots[i]=newSlot(n);D.active=i;closeModal();tab='cat';render();toast(`${n}이(가) 집에 왔어요! 무늬는 ${COATS[D.slots[i].cat.coat].n}.`);break}
    case 'slotdel':{const i=+b.dataset.i,sl=D.slots[i];confirmBox('정말 지울까요?',`${i+1}번 슬롯의 ${esc(sl.cat.name)}와(과) 과제·목표 기록이 모두 사라져요. 되돌릴 수 없어요.`,'삭제',()=>{D.slots[i]=null;if(D.active===i){const n=D.slots.findIndex(Boolean);if(n<0){save();D.active=0;render();startModal(0);return}D.active=n}save();render();toast('슬롯을 지웠어요.')});break}
    case 'wipe':confirmBox('정말 모두 지울까요?','모든 슬롯, 과제, 목표, 직업 도감이 지워져요. 저장 파일을 받아두지 않았다면 되돌릴 수 없어요.','모두 삭제',()=>{D=null;try{localStorage.removeItem(KEY)}catch(e){}$('main').innerHTML='';startModal(0)});break;
    case 'export':exportFile();break;
    case 'import':$('fileIn').click();break;
    case 'codecopy':{const code=toCode(),box=$('codeBox');box.value=code;
      D.lastBackup=Date.now();save();(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast('백업 코드를 복사했어요.')).catch(()=>{box.focus();box.select();toast('코드를 길게 눌러 복사해 주세요.')});break}
    case 'codeload':{try{importData(fromCode($('codeBox').value))}catch(err){toast('코드가 올바르지 않아요.')}break}
  }
});
function keepInput(fn){const ids=['tText','tSub','sName'],v={};ids.forEach(i=>{if($(i))v[i]=$(i).value});fn();ids.forEach(i=>{if($(i)&&v[i]!==undefined)$(i).value=v[i]})}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('room')){e.preventDefault();pet()}});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&pending){closeModal();pending=null}});

/* ===== 시계 ===== */
function tick(){
  const nd=new Date(),ne=$('now');if(ne){const t=`${nd.getMonth()+1}/${nd.getDate()} (${WD[nd.getDay()]}) ${pad(nd.getHours())}:${pad(nd.getMinutes())}`;if(ne.textContent!==t)ne.textContent=t}
  const s=S();if(!s)return;if(C().youthAt&&!C().job&&Date.now()>=youthEnd(C()))checkYouth();const r=s.pomo.run;
  if(r&&Date.now()>=r.start+r.dur){
    if(r.phase==='focus'){const end=r.start+r.dur,d=ymd(new Date(end));s.pomoDays[d]=(s.pomoDays[d]||0)+1;(s.pomoLog=s.pomoLog||[]).push({d,sub:r.sub,min:Math.round(r.dur/60000)});
      s.pomo.run={phase:'rest',start:end,dur:s.pomo.rest*60000,sub:r.sub};reward(r.sub,'뽀모도로');addLog('집사 옆에서 같이 집중했다. 이것도 공부한 거다냥.');}
    else{s.pomo.run=null;toast('휴식 끝! 다음 집중을 시작해 볼까요?');}
    render();
    return;
  }
  if(r&&$('pClock')){const left=Math.max(0,r.start+r.dur-Date.now());$('pClock').textContent=`${pad(Math.floor(left/60000))}:${pad(Math.floor(left/1000)%60)}`}
}
setInterval(tick,1000);
setInterval(()=>{if(S()&&$('modal').hidden&&!document.activeElement.matches('input,select,textarea'))render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S()){tick();if($('modal').hidden)render()}});

/* ===== 시작 ===== */
if(!D){startModal(0)}else{tick();render();if(C()&&C().job)endingModal()}
</script>


<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}</script>
